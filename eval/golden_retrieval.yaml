# Test questions for the search step (S2).
#
# Each topic is asked three ways: English (en), Hindi in Devanagari (hi) and Hinglish, i.e. Hindi typed in
# English letters (hinglish). All three share one answer key, so the scores show directly how much each
# search method loses on Hindi and Hinglish.
#
# Answer key: a chunk counts as a correct result when
#   - it comes from one of `sources`, and
#   - its text contains at least one phrase from `any` (lower case), and
#   - it contains every phrase in `all` (when given).
# This is written as a rule rather than a list of chunk ids, so it can be read and checked by a person and
# still works when the chunks are rebuilt.

topics:
  - id: dengue-symptoms
    sources: [ncvbdc-dengue-2023, who-dengue]
    any: ["symptom", "clinical feature", "retro-orbital", "behind the eyes"]
    questions:
      en: What are the symptoms of dengue?
      hi: डेंगू के लक्षण क्या हैं?
      hinglish: dengue ke lakshan kya hote hain

  - id: dengue-warning-signs
    sources: [ncvbdc-dengue-2023, who-dengue]
    any: ["warning sign"]
    questions:
      en: Which warning signs in dengue mean the patient must go to hospital?
      hi: डेंगू में कौन से खतरे के संकेत हों तो तुरंत अस्पताल जाना चाहिए?
      hinglish: dengue me kaun se khatre ke sign ho to turant hospital jana chahiye

  - id: dengue-mosquito-breeding
    sources: [ncvbdc-dengue-2023, who-dengue, ncvbdc-chikungunya-2023, asha-integrated-c]
    any: ["breeding", "stagnant", "container"]
    all: ["aedes"]
    questions:
      en: How can we stop dengue mosquitoes from breeding around the house?
      hi: घर के आसपास डेंगू के मच्छरों को पनपने से कैसे रोकें?
      hinglish: ghar ke aas paas dengue ke machhar paida hone se kaise roke

  - id: chikungunya-joint-pain
    sources: [ncvbdc-chikungunya-2023]
    any: ["joint pain", "arthralgia", "arthritis"]
    questions:
      en: Why does chikungunya cause joint pain and how long does it last?
      hi: चिकनगुनिया में जोड़ों का दर्द कितने दिन रहता है?
      hinglish: chikungunya me jodo ka dard kitne din tak rehta hai

  - id: malaria-symptoms
    sources: [ncvbdc-malaria-2011, who-malaria, asha-integrated-c]
    any: ["chills", "shivering", "rigor"]
    questions:
      en: What are the signs of malaria fever?
      hi: मलेरिया बुखार के लक्षण क्या होते हैं?
      hinglish: malaria bukhar ke lakshan kya hote hai

  - id: malaria-bednets
    sources: [ncvbdc-malaria-2011, who-malaria, asha-integrated-c]
    any: ["bed net", "bednet", "llins", "llin ", "insecticide-treated net", "insecticide treated net", "mosquito net"]
    questions:
      en: Do mosquito nets help prevent malaria?
      hi: क्या मच्छरदानी से मलेरिया से बचाव होता है?
      hinglish: kya machhardani lagane se malaria se bachav hota hai

  - id: tb-symptoms
    sources: [ntep-differentiated-tb-care-2025, who-tuberculosis, asha-integrated-c]
    any: ["cough"]
    all: ["tb"]
    questions:
      en: I have had a cough for three weeks with weight loss. Could it be TB?
      hi: तीन हफ्ते से खांसी है और वजन घट रहा है, क्या यह टीबी हो सकती है?
      hinglish: teen hafte se khansi hai aur wajan kam ho raha hai, kya ye TB ho sakta hai

  - id: tb-treatment-complete
    sources: [ntep-differentiated-tb-care-2025, who-tuberculosis, asha-integrated-c]
