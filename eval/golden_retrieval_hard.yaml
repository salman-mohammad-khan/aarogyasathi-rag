# Hard test set for the search step (S2), written 2026-11-25 AFTER the first set and BEFORE any run on it.
#
# Why a second set: the first 81 questions reached 1.00 hit@5, and the English-rewrite word list and one answer-key
# fix were made after seeing them, so those scores are optimistic. These 30 questions were not used to tune
# anything. Rules followed when writing them:
#   - one language per question (8 English, 8 Hindi, 14 Hinglish), worded like a worried villager would type;
#   - everyday words that are NOT in the rewrite word list ("pet me marod", "peela", "sust", "chakkar",
#     "garbhvati", "balgam", "doodh nahi pee raha");
#   - harder shapes: two symptoms at once, vague descriptions, myths, questions whose answer is one detail.
# The answer key works like golden_retrieval.yaml: a chunk is correct when it comes from one of `sources`, contains
# at least one phrase in `any`, and every phrase in `all` (lower case).

topics:
