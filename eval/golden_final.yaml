# sent through the whole pipeline (app.main.answer_message) with the real models, the Gemma safety check and search.
#
# expect:
#   answer      a health question the library or a trusted website should answer, with at least one source
#   emergency   the emergency or self-harm reply (108 / 112 or Tele-MANAS 14416) must come first
