# AarogyaSathi v2 document library.
# One entry per source. The files themselves are NOT in git (licences differ); `python -m ingest.fetch` downloads
# them into data/raw/. Every answer cites the entry's title, publisher, URL and page.
#
# layer A = community level, plain language (ASHA material, community manuals), main source for rural users
# layer B = national programme guidelines (facts; contain medicine doses, which public answers never quote)
# layer C = WHO fact sheets (short, plain English; licence CC BY-NC-SA 3.0 IGO)
#
# Fields: id, title, publisher, url, type (pdf|html), language (en|hi), layer, licence, topics
# exclude: reason the source is kept on the list but not used (it is downloaded and reported, not chunked)

